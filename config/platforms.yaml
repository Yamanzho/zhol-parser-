# Character caps for generated drafts. Google 750 is the Business Profile description length.
# Yandex and 2GIS stay at 1000 until a cabinet help page is cited. 2GIS description is not written.
# Service text and review replies use a shorter cap than the company description.
text_limits:
  company_description: 750
  platform_description:
    2gis: 1000
    yandex: 1000
    google: 750
  service_description: 300
  review_reply: 600
